location = /sebastianlinkmusic {
    return 301 /sebastianlinkmusic/;
}

location ^~ /sebastianlinkmusic/css/ {
    alias /apps/vpics/web/css/;
}

location = /sebastianlinkmusic/media/vpics.yaml {
    deny all;
}

location ^~ /sebastianlinkmusic/media/ {
    alias /data/media/sebastianlinkmusic/;
}

location /sebastianlinkmusic/ {
    access_log /var/log/nginx/vpics/access.log;
    error_log  /var/log/nginx/vpics/error.log;

    include proxy_params;
    proxy_pass http://unix:/apps/vpics/web/vpics.sock;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
